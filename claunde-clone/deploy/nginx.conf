# Claunde — nginx do Docker Compose.
# Serve o front-end estático e faz proxy do /api para o uvicorn.
# Montado em /etc/nginx/conf.d/default.conf no container.

upstream claunde_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mensagens longas / anexos colados no chat.
    client_max_body_size 20m;

    charset utf-8;
    charset_types text/css application/javascript text/markdown application/json;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json text/markdown image/svg+xml;

    access_log /var/log/nginx/claunde.access.log;
    error_log  /var/log/nginx/claunde.error.log warn;

    # ---------------------------------------------------------------
    # Front-end estático
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # css/js não têm hash no nome: revalida sempre em vez de cachear,
    # senão o browser segura a versão antiga depois de um deploy.
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ---------------------------------------------------------------
    # API — inclui SSE (POST /api/chats/*/messages, /api/models/pull)
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://claunde_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming token a token: nada de bufferizar a resposta.
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # O modelo pode demorar (OLLAMA_TIMEOUT=600) e `pull` de modelo
        # grande demora mais ainda.
        proxy_connect_timeout 10s;
        proxy_send_timeout    1h;
        proxy_read_timeout    1h;

        # Cliente cancelou (botão "parar"): derruba o upstream junto.
        proxy_ignore_client_abort off;
    }

    # Docs do FastAPI.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://claunde_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
